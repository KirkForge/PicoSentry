name: PicoDome Admission Real-Cluster Matrix

# WO4.0.0-017: three kind clusters on every push was heavyweight runner spend
# with stale node images and no PR-feedback value — moved to the nightly
# cadence (offset from ci.yml's 03:00 nightly to avoid runner contention)
# plus manual dispatch.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission-kind:
    name: admission-kind (${{ matrix.k8s-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # kind node images for the last three supported Kubernetes minor
        # releases (refreshed 2026-08: 1.34/1.35/1.36; the previous
        # v1.28–v1.30 set was EOL).
        k8s-version:
          - v1.34.8
          - v1.35.5
          - v1.36.1
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up kind (${{ matrix.k8s-version }})
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.32.0
          node_image: kindest/node:${{ matrix.k8s-version }}
          cluster_name: picosentry-admission-${{ matrix.k8s-version }}
          wait_on_ready: true

      - name: Run admission live test
        run: |
          export PICOSENTRY_KIND_CLUSTER="picosentry-admission-${{ matrix.k8s-version }}"
          export PICOSENTRY_KIND_SKIP_CREATE=1
          bash scripts/live_test_admission.sh
