name: PicoSentry CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # PRs to dev are the real review flow (gh pr list: #5/#6 targeted dev and
  # got no PR-tier CI under a main-only trigger) — WO5.0.0-026.
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A new push to the same PR/ref supersedes any in-flight run — cancel it
# instead of burning runners on obsolete commits. Scheduled (nightly) runs
# get their own group and are never cancelled: a push to main during the
# 03:00 exhaustive run must not kill it (WO5.0.0-026).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  PYTHON_VERSION: '3.12'

# Execution model: PR = fast feedback (lint always; pytest/budget/artifact
# checks only when code changed), push to main/dev = post-merge breadth
# (version matrix, live services, docker, reproducible build), nightly =
# exhaustive (everything + coverage + audit). Test-selection policy lives in
# scripts/test.sh, not here.

jobs:
  # ── PR validation ──────────────────────────────────────────────────────

  # Path-aware fast path (#85): one cheap job classifies the PR diff so every
  # pytest job can skip on docs/workflow-only changes. `code` = anything that
  # can change runtime or test behavior; `scan` = anything that can change
  # scan output artifacts (REPORT.json / docs/BENCHMARKS.md).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scan: ${{ steps.filter.outputs.scan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$files"
          # `code` = anything that can change runtime, test, or build
          # behavior. WO4.0.0-017: scripts/, Dockerfile, docker-bake.hcl,
          # action.yml and deploy/** used to fall through this filter — a PR
          # breaking them skipped pytest/type-check/cli/determinism entirely.
          # WO5.0.0-026: .dockerignore (build context), ci-templates/,
          # .env.example, .pre-commit-config.yaml and docs/BENCHMARKS.md
          # (the exact artifact scan-artifacts guards) also classify as code.
          # tests/test_ci_paths.py pins this classification.
          code_re='^(picosentry/|tests/|scripts/|deploy/|ci-templates/|pyproject\.toml$|uv\.lock$|Dockerfile[^/]*$|\.dockerignore$|docker-bake\.hcl$|action\.yml$|\.env\.example$|\.pre-commit-config\.yaml$|\.github/workflows/|docs/BENCHMARKS\.md$)'
          scan_re='^(picosentry/(scan|firewall|_core)/|tests/scan/|scripts/render_benchmarks\.py$|pyproject\.toml$|uv\.lock$|docs/BENCHMARKS\.md$)'
          if grep -Eq "$code_re" <<<"$files"; then echo "code=true" >>"$GITHUB_OUTPUT"; else echo "code=false" >>"$GITHUB_OUTPUT"; fi
          if grep -Eq "$scan_re" <<<"$files"; then echo "scan=true" >>"$GITHUB_OUTPUT"; else echo "scan=false" >>"$GITHUB_OUTPUT"; fi

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev ruff check picosentry/ tests/ scripts/
      - run: uv run --extra dev ruff format --check picosentry/ tests/ scripts/

  type-check:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev mypy picosentry/

  # The ONE PR pytest job. tests/scan and tests/sandbox are subsets of this
  # run (testpaths=tests), so dedicated scan/sandbox pytest jobs were removed
  # as duplicate validation — their unique non-pytest steps live in
  # scan-artifacts below.
  test-fast:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash scripts/test.sh fast --junit
      - name: Slow-test budget report (warn mode on PR)
        if: always()
        run: python3 scripts/check-test-budget.py .pytest-artifacts/junit-fast.xml --warn
      - name: Upload JUnit (always — a flaky failure must leave a name)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-fast-pr
          path: .pytest-artifacts/junit-fast.xml

  # Scan artifact consistency (moved out of the old test-scan job; the pytest
  # part was a duplicate of test-fast). Only runs when scan-relevant paths
  # changed — a watch/serve-only PR cannot drift REPORT.json.
  scan-artifacts:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate REPORT.json
        run: uv run --extra scan picosentry scan --validate --output tests/scan/fixtures/validation/REPORT.json
      - name: Render per-rule table from REPORT.json
        run: uv run python scripts/render_benchmarks.py
      - name: Verify docs/BENCHMARKS.md + REPORT.json are in sync
        run: git diff --exit-code docs/BENCHMARKS.md tests/scan/fixtures/validation/REPORT.json
      - name: Verify scan determinism
        run: uv run --extra scan picosentry scan --verify-determinism tests/scan/fixtures/validation/positive/

  cli-verification:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv run --extra all picosentry --version
          uv run --extra all picosentry health
          uv run --extra all picosentry scan --help
          uv run --extra all picosentry sandbox --help
          uv run --extra all picosentry watch --help
          uv run --extra all picosentry serve --help

  determinism-check:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Verify shared enums are consistent
        run: |
          uv run python -c "
          from picosentry._core.models import Severity, Verdict
          from picosentry.scan.models import Severity as ScanSev
          from picosentry.sandbox.models import Severity as SandboxSev, Verdict as SandboxVerdict
          from picosentry.watch.types import Verdict as WatchVerdict
          for s in Severity:
              assert ScanSev(s.value).value == s.value, f'Scan Severity mismatch: {s}'
              assert SandboxSev(s.value).value == s.value, f'Sandbox Severity mismatch: {s}'
          print('All Severity enum values match across components')
          assert Verdict.ALLOW.value == 'ALLOW'
          assert SandboxVerdict.ALLOW.value == 'ALLOW'
          print('All Verdict enum values match')
          # watch's Verdict is a separate PASS/WARN/BLOCK vocabulary, not a
          # re-export of _core's — pin it so member order/values can't drift
          # silently (WO4.0.0-017 evidence #7).
          assert [v.name for v in WatchVerdict] == ['PASS', 'WARN', 'BLOCK'], 'watch Verdict members drifted'
          assert [v.value for v in WatchVerdict] == ['pass', 'warn', 'block'], 'watch Verdict values drifted'
          print('watch Verdict vocabulary pinned')
          "

  # ── post-merge (push to main/dev) ─────────────────────────────────────

  test-matrix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash scripts/test.sh integration --junit
      - name: Slow-test budget check (enforced on push)
        if: always()
        run: python3 scripts/check-test-budget.py .pytest-artifacts/junit-integration.xml --total-budget 1200 --out .pytest-artifacts/slowest-tests.md
      - name: Upload JUnit + slow-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: .pytest-artifacts/

  postgres-live-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: ['15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_USER: picoshogun
          POSTGRES_PASSWORD: picoshogun-test
          POSTGRES_DB: picoshogun
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # WO4.0.0-003: run the serve org/auth/backup integration flows against a
      # real Postgres (env-pointed DB) instead of the old inline smoke script.
      # Each test file gets a freshly created database, mirroring the
      # per-worker isolation tests/serve/conftest.py gives the sqlite runs —
      # no xdist, so no shared-database trampling.
      - name: Run serve org/auth/backup flows against Postgres
        env:
          PICOSHOGUN_DATABASE_BACKEND: postgres
          PICOSHOGUN_DATABASE_URL: postgresql://picoshogun:picoshogun-test@127.0.0.1:15432/picoshogun
        run: |
          set -euo pipefail
          FILES="tests/serve/test_org_pg_flows.py tests/serve/test_integration_auth.py tests/serve/test_integration_services.py tests/serve/services/test_backup.py"
          for f in $FILES; do
            db="pg_live_$(basename "$f" .py)"
            echo "::group::pytest $f (db: $db)"
            uv run --extra serve --extra dev --with psycopg2-binary python -c '
          import os
          import sys
          import psycopg2
          conn = psycopg2.connect(os.environ["PICOSHOGUN_DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(f"DROP DATABASE IF EXISTS {sys.argv[1]}")
              cur.execute(f"CREATE DATABASE {sys.argv[1]}")
          conn.close()
          ' "$db"
            # Build the per-file URL from parts. Appending "/$db" to
            # $PICOSHOGUN_DATABASE_URL would yield .../picoshogun/$db —
            # psycopg2 takes everything after the last slash as the dbname,
            # so it received the invalid "picoshogun/pg_live_..." and every
            # run failed (runs 32043226257, 31746260038).
            PICOSHOGUN_DATABASE_URL="postgresql://picoshogun:picoshogun-test@127.0.0.1:15432/$db" \
              uv run --extra serve --extra dev --with psycopg2-binary \
              pytest "$f" -n0 -p no:cacheprovider -q --timeout=180
            echo "::endgroup::"
          done

  reproducible-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel twice and assert identical hashes
        run: |
          # Pin the build timestamp so the wheel is byte-identical across
          # runs. The commit timestamp is stable for a given checkout.
          export SOURCE_DATE_EPOCH="$(date -d "${GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP}" +%s)"
          uv run --with build python -m build --wheel --outdir /tmp/build1
          uv run --with build python -m build --wheel --outdir /tmp/build2
          H1=$(sha256sum /tmp/build1/*.whl | awk '{print $1}')
          H2=$(sha256sum /tmp/build2/*.whl | awk '{print $1}')
          echo "build1: $H1"
          echo "build2: $H2"
          test "$H1" = "$H2" || { echo "FAIL: wheel not reproducible"; exit 1; }
          echo "PASS: wheel reproducible"
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Build sdist twice, normalize, and assert identical hashes
        run: |
          # setuptools ignores SOURCE_DATE_EPOCH for tar container metadata,
          # so raw sdists differ across builds; scripts/normalize_sdist.py
          # clamps what it misses (WO4.0.0-009). release.yml ships the
          # normalized artifact, so this job must compare the same way.
          export SOURCE_DATE_EPOCH="$(date -d "${GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP}" +%s)"
          uv run --with build python -m build --sdist --outdir /tmp/sdist1
          uv run --with build python -m build --sdist --outdir /tmp/sdist2
          python3 scripts/normalize_sdist.py /tmp/sdist1/picosentry-*.tar.gz /tmp/sdist1-norm.tar.gz "$SOURCE_DATE_EPOCH"
          python3 scripts/normalize_sdist.py /tmp/sdist2/picosentry-*.tar.gz /tmp/sdist2-norm.tar.gz "$SOURCE_DATE_EPOCH"
          S1=$(sha256sum /tmp/sdist1-norm.tar.gz | awk '{print $1}')
          S2=$(sha256sum /tmp/sdist2-norm.tar.gz | awk '{print $1}')
          echo "sdist build1 (normalized): $S1"
          echo "sdist build2 (normalized): $S2"
          test "$S1" = "$S2" || { echo "FAIL: sdist not reproducible after normalization"; exit 1; }
          echo "PASS: sdist reproducible (post-normalization)"
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

  # Docker jobs do not `needs: test-matrix`: image correctness and the Python
  # compatibility matrix are independent validations that ran serially before
  # — the matrix still runs (and still gates the push run), this just takes
  # the slow QEMU arm64 build off the matrix's critical path (#84).
  docker-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        # GHA cache (WO5.0.0-026): same cache backend the bake release uses;
        # layer reuse across pushes instead of full rebuilds.
        run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max --load -t picosentry:test .
      - name: Verify Docker CLI
        run: |
          docker run --rm picosentry:test --version
          docker run --rm picosentry:test health
      - name: Verify sigstore is importable in the image
        run: |
          docker run --entrypoint python --rm picosentry:test -c "import sigstore; print('sigstore', sigstore.__version__, 'available')"
      - name: Verify --sign sigstore fails predictably (missing identity, not missing tooling)
        run: |
          output=$(docker run --rm picosentry:test corpus export /tmp/test-pack.json --sign sigstore 2>&1 || true)
          if echo "$output" | grep -qi "identity"; then
            echo "PASS: sigstore signing fails on missing identity (expected in CI without OIDC token)"
          elif echo "$output" | grep -qi "module.*not found\|ImportError.*sigstore"; then
            echo "FAIL: sigstore package is missing from the image"
            exit 1
          else
            echo "UNEXPECTED: $output"
            exit 1
          fi

  docker-build-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build arm64 Docker image
        run: docker buildx build --platform linux/arm64 --cache-from type=gha --cache-to type=gha,mode=max --load -t picosentry:test-arm64 .
      - name: Verify arm64 image runs scan on a known-malicious fixture
        run: |
          docker run --platform linux/arm64 --rm -v $PWD/tests/scan/fixtures/validation/positive/malicious_pypi:/fixture picosentry:test-arm64 scan /fixture --format json | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['findings']) > 0, 'Expected findings on malicious fixture'; print(f'PASS: {len(d[\"findings\"])} findings on arm64')"
      - name: Verify arm64 image runs sandbox smoke
        run: |
          docker run --platform linux/arm64 --rm picosentry:test-arm64 sandbox --help > /dev/null && echo "PASS: sandbox --help on arm64" || echo "NOTE: sandbox --help may fail under QEMU emulation (seccomp arch mismatch) — this is expected; the release buildx bake builds natively"

  # WO5.0.0-019 deliverable 4 (folded from WO4.0.0-001): prove the landlock
  # backend on a real kernel — restrict → EACCES round-trips and cross-backend
  # verdict parity — instead of only via env-gated local runs. ubuntu-24.04
  # ships kernel 6.8 with the landlock LSM. The integration profile exports
  # PICODOME_HAS_LANDLOCK=1; the tests self-gate on is_available() and skip
  # honestly on kernels without landlock. Scoped to the two landlock-bearing
  # files: 96 tests, ~6s warm (measured WO5.0.0-019).
  landlock-real-exec:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/test.sh integration tests/sandbox/test_landlock_backend.py tests/sandbox/test_verdict_parity.py

  # ── nightly (schedule / manual) ────────────────────────────────────────

  nightly-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # nightly profile: no marker filter — slow/network/benchmark_realworld and
      # malicious_workload (script sets PICODOME_SANDBOX_TESTS=1) all run here.
      # Coverage runs in the same pass (WO4.0.0-017): a separate full suite
      # just to attach --cov doubled the nightly wall time for one XML file.
      - run: bash scripts/test.sh nightly --cov=picosentry --cov-report=xml --cov-report=term-missing
      - name: Slow-test budget report (warn mode; enforce once baseline is known)
        if: always()
        run: python3 scripts/check-test-budget.py .pytest-artifacts/junit.xml --warn --out .pytest-artifacts/slowest-tests.md
      - name: Upload JUnit + slow-test report + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-report
          path: |
            .pytest-artifacts/
            coverage.xml

  dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Export uv.lock as a requirements file
        run: |
          uv export --frozen --no-hashes --all-extras --all-groups -o requirements-audit.txt
          grep -v '^-e ' requirements-audit.txt > requirements-audit.clean.txt
      - name: Run pip-audit against lockfile
        run: uv run --with pip-audit pip-audit --no-deps -r requirements-audit.clean.txt --desc
