name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v2.0.17 && git push origin v2.0.17
#
# This produces the supply-chain evidence PicoSentry's own audit (gap #4)
# asks for: a CycloneDX SBOM, SLSA build-provenance attestation (via the
# GitHub trusted builder's OIDC identity), and Sigstore signatures on the
# wheel + sdist. These cannot be produced faithfully on a developer laptop —
# the provenance is only meaningful when it attests the GitHub-hosted build.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # create the GitHub Release + upload assets
  id-token: write       # keyless Sigstore signing + SLSA provenance OIDC
  attestations: write   # actions/attest-build-provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "tag $GITHUB_REF_NAME != pyproject $PKG"; exit 1; }

      - name: Build wheel + sdist
        run: |
          pip install --no-cache-dir build
          # Pin the build timestamp so the wheel is byte-identical across
          # runs (reproducible builds / SLSA L3). The commit timestamp is
          # stable for a given tag, so re-running the release job yields the
          # same artifact hashes.
          export SOURCE_DATE_EPOCH="$(date -d "${GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP}" +%s)"
          python -m build
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Normalize sdist for reproducibility
        run: |
          # setuptools ignores SOURCE_DATE_EPOCH for tar container metadata
          # (dir-entry mtimes/uids, gzip header) — clamp it so two builds of
          # the same tag hash identically. The normalized artifact is what
          # gets checksummed, signed, and uploaded (WO4.0.0-009).
          VER="${GITHUB_REF_NAME#v}"
          export SOURCE_DATE_EPOCH="$(date -d "${GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP}" +%s)"
          python scripts/normalize_sdist.py "dist/picosentry-${VER}.tar.gz" "dist/picosentry-${VER}.tar.gz.norm" "$SOURCE_DATE_EPOCH"
          mv "dist/picosentry-${VER}.tar.gz.norm" "dist/picosentry-${VER}.tar.gz"
        env:
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Generate CycloneDX SBOM
        run: |
          pip install --no-cache-dir cyclonedx-bom
          cyclonedx-py environment "$(which python)" --of JSON --output-reproducible \
            -o "dist/picosentry-${GITHUB_REF_NAME#v}.sbom.cdx.json"

      - name: Checksums
        run: cd dist && sha256sum * > "picosentry-${GITHUB_REF_NAME#v}.SHA256SUMS"

      - name: SLSA build-provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/picosentry-*.whl,dist/picosentry-*.tar.gz'

      - name: Sigstore sign artifacts (keyless, OIDC)
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/picosentry-*.whl dist/picosentry-*.tar.gz

      - name: Create GitHub Release with all evidence
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/picosentry-*.whl
            dist/picosentry-*.tar.gz
            dist/*.sbom.cdx.json
            dist/*.SHA256SUMS
            dist/*.sigstore*
          generate_release_notes: true

      # Optional: publish to PyPI via Trusted Publishing (configure the
      # publisher on PyPI first). Left disabled because 2.0.x was published
      # manually; enable once the trusted publisher is set up.
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    # Opt-in: requires DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets AND
    # the tooling; until vars.DOCKER_PUSH_ENABLED=true the job skips rather
    # than failing red at login (WO5.0.0-014 audit: no secrets configured).
    if: vars.DOCKER_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write   # docker/login-action with OIDC if registry supports it
      packages: write   # cosign keyless signing via Sigstore OIDC
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: docker-push
        run: |
          TAG="v${GITHUB_REF_NAME#v}"
          # Override the bake TAG variable instead of `--set '*.tags='`:
          # --set REPLACES the tag list, which dropped the :latest tag the
          # README and docs point at (WO4.0.0-009 evidence #1). With the
          # variable override, docker-bake.hcl's full list
          # [:v<TAG>, :latest] is pushed.
          TAG="${TAG}" docker buildx bake --push
          DIGEST=$(docker buildx imagetools inspect "docker.io/kirkforge/picodome:${TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify image exists on Docker Hub (existence gate)
        run: |
          TAG="v${GITHUB_REF_NAME#v}"
          # WO5.0.0-014: a release that claims a Hub image must actually
          # have one. No fallback — a missing tag fails the release here,
          # before attestation/signing publish evidence for an image that
          # cannot be pulled.
          docker buildx imagetools inspect "docker.io/kirkforge/picodome:${TAG}" --format 'verified: {{.Manifest.Digest}}'

      - name: Attest Docker image provenance
        if: steps.docker-push.outputs.digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/kirkforge/picodome
          subject-digest: ${{ steps.docker-push.outputs.digest }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image with cosign (keyless, OIDC)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cosign sign --yes "docker.io/kirkforge/picodome:v${TAG}"

      - name: Verify image on Docker Hub
        run: |
          TAG="v${GITHUB_REF_NAME#v}"
          VERSION_LINE=$(docker run --rm "docker.io/kirkforge/picodome:${TAG}" --version | head -1)
          echo "--version: ${VERSION_LINE}"
          # A missed version bump must fail the release, not pass silently
          # (WO4.0.0-009 evidence #5).
          test "$VERSION_LINE" = "PicoSentry (unified) ${TAG}" || { echo "FAIL: --version '${VERSION_LINE}' != tag ${TAG}"; exit 1; }
          docker run --rm "docker.io/kirkforge/picodome:${TAG}" health
