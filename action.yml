name: 'PicoSentry Security Scan'
description: 'Scan dependencies for malicious packages and supply-chain attacks'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  sarif-file:
    description: 'Path to write SARIF output'
    required: false
    default: 'picosentry-results.sarif'
  fail-on-findings:
    description: 'Fail the action if findings are detected'
    required: false
    default: 'true'
  format:
    description: 'Output format (json, sarif, cyclonedx, table, ml-context, github, markdown)'
    required: false
    default: 'sarif'
  severity-threshold:
    description: 'Minimum severity to report (low, medium, high, critical)'
    required: false
    default: 'low'
outputs:
  findings-count:
    description: 'Number of findings detected'
    value: ${{ steps.scan.outputs.findings_count }}
  sarif-file:
    description: 'Path to SARIF output file'
    value: ${{ steps.scan.outputs.sarif_file }}
runs:
  using: 'composite'
  steps:
    - name: Install PicoSentry
      shell: bash
      run: pip install --no-cache-dir .

    - name: Run PicoSentry scan
      id: scan
      shell: bash
      run: |
        case "${{ inputs.format }}" in
          json|sarif|cyclonedx|table|ml-context|github|markdown) ;;
          *)
            echo "::error::Invalid format '${{ inputs.format }}' (accepted: json, sarif, cyclonedx, table, ml-context, github, markdown)"
            exit 2
            ;;
        esac

        ARGS=(scan "${{ inputs.path }}" --format "${{ inputs.format }}" --output "${{ inputs.sarif-file }}")
        if [ -n "${{ inputs.severity-threshold }}" ]; then
          ARGS+=(--severity-threshold "${{ inputs.severity-threshold }}")
        fi

        picosentry "${ARGS[@]}" || exit_code=$?

        if [ -n "${exit_code}" ] && [ "$exit_code" -ne 0 ]; then
          echo "::error::PicoSentry scan failed (exit code ${exit_code}). Check the scan output above for the underlying error."
          exit "$exit_code"
        fi

        if [ ! -f "${{ inputs.sarif-file }}" ]; then
          echo "::error::PicoSentry scan produced no output file at '${{ inputs.sarif-file }}'"
          exit 2
        fi

        case "${{ inputs.format }}" in
          sarif|github)
            if [ "${{ inputs.format }}" = "github" ]; then COUNT_FILE="sarif.json"; else COUNT_FILE="${{ inputs.sarif-file }}"; fi
            FINDINGS_COUNT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('runs',[{}])[0].get('results',[])))" "$COUNT_FILE") || {
              echo "::error::Failed to parse '$COUNT_FILE' as SARIF — refusing to report 0 findings"
              exit 2
            }
            ;;
          json)
            FINDINGS_COUNT=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('findings',[])))" "${{ inputs.sarif-file }}") || {
              echo "::error::Failed to parse '${{ inputs.sarif-file }}' as a JSON scan report — refusing to report 0 findings"
              exit 2
            }
            ;;
          *)
            if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
              echo "::error::fail-on-findings requires a findings-bearing format (sarif, github or json); '${{ inputs.format }}' cannot trip it"
              exit 2
            fi
            FINDINGS_COUNT=0
            ;;
        esac

        echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"
        echo "sarif_file=${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.fail-on-findings }}" = "true" ] && [ "$FINDINGS_COUNT" -gt 0 ]; then
          echo "::warning::$FINDINGS_COUNT finding(s) detected"
          exit 1
        fi